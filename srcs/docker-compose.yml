services:
 nginx:
  build:
    context: requirements/nginx
    dockerfile: Dockerfile
  container_name: nginx
  depends_on:
   - wordpress
   - mariadb
  ports:
   - "443:443"
  restart: always
  volumes:
   - wp-volume:/var/www/html
  networks:
   - inception
 wordpress:
  build: 
    context: requirements/wordpress
    dockerfile: Dockerfile
  container_name: wp-php
  restart: always
  volumes:
   - wp-volume:/var/www/html
  networks:
   - inception
  depends_on:
   - mariadb
  env_file:
  - .env
 mariadb:
  build: 
    context: requirements/mariadb
    dockerfile: Dockerfile
  container_name: mariadb
  restart: always
  volumes:
  - db-volume:/var/lib/mysql
  networks:
  - inception
  env_file:
  - .env

volumes:
  wp-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /Users/machi/data/wordpress
  db-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /Users/machi/data/mariadb

networks:
 inception:
  driver: bridge