user www-data;
# ubuntu上でdefaultで設定されているユーザー名。

worker_processes 1;
# nginxのワーカープロセス数を自動で設定。 CPUのコア数以下で設定する。命令が１つしかないため１にする。

events {
	worker_connections 1024;
}

http{
	log_format custom_log_format '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             '"$server_name" "$request_uri"' 
							 '"$document_root" "$fastcgi_script_name" "$args" "$uri" "$uri/"';
							 access_log /var/log/nginx/access.log custom_log_format;
							  error_log /var/log/nginx/error.log debug;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

    server {
        listen 443 ssl;
        server_name ktakamat.42.fr;

        ssl_certificate /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/certs/server.key;
        ssl_protocols TLSv1.3;

        root /var/www/html;
        index index.php index.html index.htm;



        location / {
            try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
			fastcgi_pass wp-php:9000;
			fastcgi_index index.php;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			include fastcgi_params;
        }
    }
}

